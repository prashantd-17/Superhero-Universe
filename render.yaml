# Render static-site blueprint. Deploy via "Blueprints" in the Render
# dashboard and point at this file in the repository root.
#
# Docs: https://render.com/docs/static-sites
staticSites:
  - name: superhero-universe
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/superhero-universe/browser
    pullRequestPreviewsEnabled: true
    envVars:
      - key: SITE_URL
        value: https://superhero-universe.onrender.com
    # SPA fallback — Render static sites can also configure rewrites in the
    # dashboard; this covers the common deep-link (e.g. /characters/69-batman)
    # case so requests don't 404 on the CDN.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /sitemap.xml
        name: Cache-Control
        value: public, max-age=3600
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=3600
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
